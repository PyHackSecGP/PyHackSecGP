name: Latest dev.to posts

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull dev.to posts into README
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://dev.to/feed/greenbladesec"
          max_post_count: 5
          template: "- [$title]($url) &nbsp; <sub>$date</sub>"
          date_format: "mmm d, yyyy"
